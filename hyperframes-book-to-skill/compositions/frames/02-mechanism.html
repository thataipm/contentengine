  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ===== Scene 1 (0.0-3.1s) =====
    // "It doesn't just shrink the whole thing into one file either." Animate
    // the INNER wrappers, not the clip elements themselves -- the framework
    // already manages clip visibility, and a fade ending exactly at the clip
    // boundary needs a matching hard kill so a non-linear seek can't land on
    // stale opacity.
    tl.fromTo(
      "#mech2-onefile-inner",
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
      0.0
    );
    // Red negation strike draws on right as "either." lands (2.34s).
    tl.fromTo(
      "#mech2-strike-inner",
      { opacity: 0 },
      { opacity: 1, duration: 0.05 },
      2.34
    );
    tl.to("#mech2-strike-line", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.34);
    // Both fade out fast into the cut to Scene 2.
    tl.to("#mech2-onefile-inner", { opacity: 0, scale: 0.85, duration: 0.35, ease: "power2.in" }, 2.75);
    tl.to("#mech2-strike-inner", { opacity: 0, duration: 0.35, ease: "power2.in" }, 2.75);
    // Hard kill exactly at the clip's own start boundary (3.10s) so a
    // non-linear seek never lands between "faded to 0" and "clip unmounted"
    // with stale visibility state.
    tl.set("#mech2-onefile-inner", { opacity: 0 }, 3.1);
    tl.set("#mech2-strike-inner", { opacity: 0 }, 3.1);

    // ===== Scene 2 (3.1-11.44s) =====
    // "It splits the book into a short core file that's always loaded, and
    // separate chapter files that only open when your agent actually needs
    // them." Core file settles right after the negation strike clears (3.3s)
    // -- moved up from a literal "core file" word-sync (4.7s) after a
    // snapshot review showed a ~1.6s dead-air gap between Scene 1 clearing
    // and this reveal; settling early and holding/breathing into the actual
    // words reads better than an empty near-black hold.
    tl.fromTo(
      "#mech2-core-tile",
      { opacity: 0, y: 16, scale: 0.85 },
      { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.3)" },
      3.3
    );
    // Gentle idle breathe so the hold across Scene 2 isn't a frozen frame.
    tl.to("#mech2-core-tile", { scale: 1.03, duration: 0.7, ease: "sine.inOut" }, 5.6);
    tl.to("#mech2-core-tile", { scale: 1, duration: 0.7, ease: "sine.inOut" }, 6.3);
    tl.to("#mech2-core-tile", { scale: 1.03, duration: 0.7, ease: "sine.inOut" }, 9.5);
    tl.to("#mech2-core-tile", { scale: 1, duration: 0.7, ease: "sine.inOut" }, 10.2);

    // Chapter tiles stagger-assemble starting right after "loaded," (6.22s)
    // through "needs them." (10.34-11.06s), each lighting green on-demand
    // then dimming back to a neutral outline -- never all lit at once.
    const chapterStarts = [6.3, 7.2, 8.1, 9.0, 9.9];
    chapterStarts.forEach((t, i) => {
      const sel = "#mech2-ch-" + i;
      tl.fromTo(
        sel,
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.5)" },
        t
      );
      tl.to(
        sel,
        {
          borderColor: "#34d399",
          backgroundColor: "rgba(52,211,153,0.14)",
          color: "#34d399",
          duration: 0.22,
          ease: "power2.out",
        },
        t + 0.24
      );
      tl.to(
        sel,
        {
          borderColor: "rgba(245,243,237,0.16)",
          backgroundColor: "#1a1a20",
          color: "#9a9aa2",
          duration: 0.3,
          ease: "power1.inOut",
        },
        t + 0.46
      );
    });

    window.__timelines["02-mechanism"] = tl;
  </script>
