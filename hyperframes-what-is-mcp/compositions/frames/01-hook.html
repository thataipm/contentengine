  <script>

    const tl = gsap.timeline({ paused: true });

    const glow = document.getElementById("h1-glow");
    const mcpLabel = document.getElementById("h1-mcp-label");
    const mcpSub = document.getElementById("h1-mcp-sub");
    const plug = document.getElementById("h1-plug");
    const port = document.getElementById("h1-port");
    const toolsIcon = document.getElementById("h1-icon-tools");
    const dataIcon = document.getElementById("h1-icon-data");
    const connectGlow = document.getElementById("h1-connect-glow");
    const pulse = document.getElementById("h1-pulse");
    const captionWork = document.getElementById("h1-caption-work");

    // "This is MCP" (0.12s) -- the wordmark arrives first.
    tl.fromTo(mcpLabel, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.12);
    tl.to(glow, { opacity: 0.22, duration: 0.8, ease: "power2.out" }, 0.3);
    tl.fromTo(mcpSub, { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.54);

    // "the standard" (1.54s) -- port draws in first, it's the fixed anchor.
    tl.fromTo(port, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 1.54);

    // "that lets your AI" (2.24-3.1s) -- plug appears above, not yet moving.
    tl.fromTo(plug, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.24);

    // "actually touch your tools" (3.6-4.62s) -- tools icon pops in.
    tl.fromTo(toolsIcon, { opacity: 0, scale: 0.5, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" }, 4.18);

    // "and data" (4.92s) -- data icon pops in.
    tl.fromTo(dataIcon, { opacity: 0, scale: 0.5, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(1.7)" }, 4.92);

    // "It's AI's version" (6.2-6.94s) -- plug begins its descent toward the port.
    tl.to(plug, { y: 380, duration: 1.0, ease: "power2.in" }, 6.2);

    // "of USB-C." (7.48-7.78s) -- the snap: plug lands, scale-pop, glow flash. The literal moment.
    tl.to(plug, { y: 400, duration: 0.3, ease: "power4.in" }, 7.48);
    tl.to(port, { scale: 1.06, duration: 0.12, ease: "power2.out" }, 7.78);
    tl.to(port, { scale: 1, duration: 0.2, ease: "power2.out" }, 7.9);
    tl.fromTo(connectGlow, { opacity: 0 }, { opacity: 0.6, duration: 0.25 }, 7.78);
    tl.to(connectGlow, { opacity: 0.25, duration: 0.4 }, 8.05);
    tl.fromTo(mcpLabel, { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1 }, 7.78);

    // "Here's exactly how it works." (9.48-10.44s) -- the connection is
    // live: one continuous pulse travels up the line, foreshadowing the
    // request/response exchange in the next frame. A single tween spanning
    // the whole phrase rather than two overlapping ones, which GSAP would
    // otherwise conflict-resolve by snapping the pulse back to its start
    // state mid-flight.
    tl.fromTo(captionWork, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 9.48);
    tl.fromTo(pulse, { opacity: 0, y: 0 }, { opacity: 1, y: -180, duration: 1.4, ease: "power1.inOut" }, 9.74);
