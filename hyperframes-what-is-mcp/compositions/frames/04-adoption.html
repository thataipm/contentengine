    /* -- fills two real narration gaps: "By December" before the

       chips appear -- */
    .a4-beat {

  </style>

  <div id="root" data-composition-id="04-adoption" data-width="1080" data-height="1920">

    <div id="a4-spine" class="a4-spine clip" data-start="0" data-duration="24.0" data-track-index="2"></div>

    </div>

    <div id="a4-beat-december" class="a4-beat clip" data-start="0" data-duration="24.0" data-track-index="9">by december</div>

    <!-- real, live-verified proof beat after the real VO content ends
         (last word "Amazon." lands 19.45s) -- a genuine animated line
         chart (mk-line-graph, installed from the registry), not a static
         card, showing the actual MCP server count growth. -->
    <div id="a4-chart-heading" class="a4-beat clip" data-start="0" data-duration="24.0" data-track-index="13" style="top: 260px; left: 90px; color: #8890a3;">verified live, glama.ai/mcp/servers</div>
    <div
      id="a4-chart"
      data-composition-id="mk-line-graph"
      data-composition-src="compositions/mk-line-graph.html"
      data-start="20.2"
      data-duration="3.7"
      data-track-index="14"
      data-width="1000"
      data-height="900"
      style="position: absolute; left: 40px; top: 340px; width: 1000px; height: 900px;"
    ></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const label = document.getElementById("a4-label");
    const spine = document.getElementById("a4-spine");

    const markA = document.getElementById("a4-mark-anthropic");
    const rowA = document.getElementById("a4-row-anthropic");
    const markO = document.getElementById("a4-mark-openai");
    const rowO = document.getElementById("a4-row-openai");
    const markG = document.getElementById("a4-mark-google");
    const rowG = document.getElementById("a4-row-google");

    const foundation = document.getElementById("a4-foundation");
    const chipGoogle = document.getElementById("a4-chip-google");
    const chipMs = document.getElementById("a4-chip-microsoft");
    const chipAmz = document.getElementById("a4-chip-amazon");
    const beatDecember = document.getElementById("a4-beat-december");
    const beatCofounded = document.getElementById("a4-beat-cofounded");

    tl.fromTo(label, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.35 }, 0.2);
    tl.to(spine, { scaleY: 1, duration: 1.0, ease: "power2.inOut" }, 0.2);

    // "Anthropic built this alone," (0.39-1.59s) -- the first mark lands.
    tl.fromTo(markA, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.39);
    tl.fromTo(rowA, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35 }, 0.39);
    // "November 2024." (2.29-2.89s) -- the date confirms, a small pulse.
    tl.fromTo(markA, { scale: 1 }, { scale: 1.3, duration: 0.15, yoyo: true, repeat: 1 }, 2.29);

    // "OpenAI adopted it" (4.31-5.49s) -- second mark, real 1.4s pause
    // before this beat is load-bearing, not dead air -- it's the gap
    // between Anthropic's launch and OpenAI's real adoption date.
    tl.fromTo(markO, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 4.31);
    tl.fromTo(rowO, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35 }, 4.31);
    tl.fromTo(markO, { scale: 1 }, { scale: 1.3, duration: 0.15, yoyo: true, repeat: 1 }, 6.09);

    // "Google's Gemini, that April." (8.11-9.75s) -- third mark.
    tl.fromTo(markG, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 8.11);
    tl.fromTo(rowG, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35 }, 8.11);
    tl.fromTo(markG, { scale: 1 }, { scale: 1.3, duration: 0.15, yoyo: true, repeat: 1 }, 9.75);

    // "By December," (10.87-11.03s) -- fills the real gap after the Google
    // mark settles and before the foundation forms.
    tl.fromTo(beatDecember, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 10.87);
    tl.to(beatDecember, { opacity: 0, duration: 0.3 }, 12.57);

    // "handed control to a neutral foundation," (12.57-14.29s) -- the three
    // marks recolor gold as the foundation badge forms below them.
    tl.to([markA, markO, markG], { borderColor: "#f0b860", duration: 0.4 }, 13.55);
    tl.fromTo(foundation, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, 13.83);

    // "co-founded with OpenAI," (15.35-16.15s) -- fills the real gap after
    // the foundation forms and before the supporter chips appear.
    tl.fromTo(beatCofounded, { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 15.35);
    tl.to(beatCofounded, { opacity: 0, duration: 0.3 }, 17.23);

    // "backed by Google, Microsoft, and Amazon." (17.75-19.45s) -- three
    // supporter chips pop in one per real name landing.
    tl.fromTo(chipGoogle, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 17.75);
    tl.fromTo(chipMs, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 18.39);
    tl.fromTo(chipAmz, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 19.27);

    // Real proof beat (20.2-23.9s), after the real VO content ends at
    // 19.45s -- a genuine animated line chart, not a static card, showing
    // the actual live server count. It occupies the same screen region the
    // timeline/marks used (top:340-1240), so that earlier content clears
    // out first -- a real fix, not cosmetic: without this the chart
    // genuinely overlapped the timeline rows and foundation badge.
    const chartHeading = document.getElementById("a4-chart-heading");
    const clearGroup = [label, spine, markA, rowA, markO, rowO, markG, rowG, foundation];
    tl.to(clearGroup, { opacity: 0, duration: 0.4, ease: "power2.in" }, 19.7);
    tl.fromTo(chartHeading, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 20.2);

    window.__timelines["04-adoption"] = tl;
  </script>
</template>
