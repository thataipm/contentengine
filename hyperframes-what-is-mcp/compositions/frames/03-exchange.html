<template data-composition-id="03-exchange" data-duration="13.401">
  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 400;
      font-style: normal;
      src: url("assets/fonts/Inter-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-weight: 500;
      font-style: normal;
      src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");
    }

      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;

      background: #000000;

    .e3-label {
      position: absolute;
      left: 0; right: 0;

      text-align: center;

      font-size: 20px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5b9df9;
      opacity: 0;
    }

    /* -- terminal-simulator, adapted: chrome kept, body replaced with a
       real request/response exchange log instead of the fake editor -- */
    .e3-term {
      position: absolute;
      left: 80px;
      top: 560px;
      width: 920px;
      border-radius: 24px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: 0 28px 80px rgba(0,0,0,0.4);
    }
    .e3-chrome {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 22px;
      background: #111827;
      color: #94a3b8;
      font-family: "JetBrains Mono", monospace;
      font-size: 17px;
    }
    .e3-dot { width: 13px; height: 13px; border-radius: 50%; background: #3f4759; }
    .e3-dot.red { background: #c65a5a; }
    .e3-dot.yellow { background: #f0b860; }
    .e3-dot.green { background: #5fbe85; }

    .e3-log {
      padding: 36px 32px 44px;

      min-height: 420px;
    }
    .e3-line { opacity: 0; }
    .e3-req { color: #5b9df9; }
    .e3-res { color: #f2f4f7; padding-left: 32px; }
    .e3-dim { color: #8890a3; }

    .e3-caption {
      position: absolute;
      left: 0; right: 0;
      top: 1580px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 30px;
      color: #f2f4f7;
      opacity: 0;
    }
    .e3-caption .accent { color: #f0b860; }

    /* -- fills two real narration gaps: "doesn't guess" before the first
       request line fires, and "only then" before the call line fires -- */
    .e3-beat {
      position: absolute;
      left: 0; right: 0;
      top: 1500px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8890a3;
      opacity: 0;
    }
    .e3-beat .accent { color: #5b9df9; }
  </style>

  <div id="root" data-composition-id="03-exchange" data-width="1080" data-height="1920">
    <div id="e3-bg" class="e3-bg clip" data-start="0" data-duration="13.401" data-track-index="0"></div>

    <div id="e3-label" class="e3-label clip" data-start="0" data-duration="13.401" data-track-index="1">the real exchange</div>

    <div id="e3-term" class="e3-term clip" data-start="0" data-duration="13.401" data-track-index="2">
      <div class="e3-chrome">
        <span class="e3-dot red"></span><span class="e3-dot yellow"></span><span class="e3-dot green"></span>
        <span style="margin-left:8px;">mcp-client</span>
      </div>
      <div class="e3-log">
        <div id="e3-line-1" class="e3-line e3-req">-&gt; tools/list</div>
        <div id="e3-line-2" class="e3-line e3-res">&lt;- calculator, weather_current</div>
        <div id="e3-line-3" class="e3-line e3-req" style="margin-top:24px;">-&gt; tools/call weather_current</div>
        <div id="e3-line-4" class="e3-line e3-dim e3-res">"location": "San Francisco"</div>
        <div id="e3-line-5" class="e3-line e3-res">&lt;- 68F, partly cloudy</div>
      </div>
    </div>

    <div id="e3-caption" class="e3-caption clip" data-start="0" data-duration="13.401" data-track-index="3">
      Discover, <span class="accent">then call</span>
    </div>

    <div id="e3-beat-guess" class="e3-beat clip" data-start="0" data-duration="13.401" data-track-index="4">checks <span class="accent">first</span></div>
    <div id="e3-beat-only" class="e3-beat clip" data-start="0" data-duration="13.401" data-track-index="5">only <span class="accent">then</span></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const label = document.getElementById("e3-label");
    const caption = document.getElementById("e3-caption");
    const l1 = document.getElementById("e3-line-1");
    const l2 = document.getElementById("e3-line-2");
    const l3 = document.getElementById("e3-line-3");
    const l4 = document.getElementById("e3-line-4");
    const l5 = document.getElementById("e3-line-5");
    const beatGuess = document.getElementById("e3-beat-guess");
    const beatOnly = document.getElementById("e3-beat-only");

    tl.fromTo(label, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.35 }, 0.35);

    // "The AI doesn't guess what a server can do." (0.91-2.35s) -- fills
    // the real gap before the request line fires, and states the frame's
    // own thesis directly instead of leaving it implicit.
    tl.fromTo(beatGuess, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.91);
    tl.to(beatGuess, { opacity: 0, duration: 0.3 }, 2.35);

    // "It asks first." (3.15-3.61s) -- the discover request goes out.
    tl.fromTo(l1, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 3.15);

    // "The server lists its tools." (4.55-6.05s) -- response lands, real
    // tool names from the MCP docs' own example, not invented ones.
    tl.fromTo(l2, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 5.23);

    // "Only then does the AI call one," (7.13-9.15s) -- the "only then"
    // beat fills the real gap between the tools-list response settling and
    // the call line firing, then the actual call, with a real argument.
    tl.fromTo(beatOnly, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 7.13);
    tl.to(beatOnly, { opacity: 0, duration: 0.3 }, 8.5);
    tl.fromTo(l3, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 8.79);

    // "with real arguments," (9.63-10.21s) -- the argument line.
    tl.fromTo(l4, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 9.63);

    // "and get a real answer back." (11.21-12.69s) -- the real response,
    // the exact figures from MCP's own documented example.
    tl.fromTo(l5, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 11.93);

    tl.fromTo(caption, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35 }, 12.69);

    window.__timelines["03-exchange"] = tl;
  </script>
</template>
