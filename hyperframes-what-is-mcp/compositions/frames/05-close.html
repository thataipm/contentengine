  <div id="root" data-composition-id="05-close" data-width="1080" data-height="1920">

    <!-- the four chips deliberately converge and overlap at 5.69s -- that
         IS the literal visual of "competitors now govern together," not a
         layout bug -- marked accordingly rather than "fixed" away. -->
    <div id="c5-chip-a" class="c5-chip clip" data-start="0" data-duration="16.051" data-track-index="2" data-layout-allow-overlap data-layout-allow-occlusion>Anthropic</div>
    <div id="c5-chip-o" class="c5-chip clip" data-start="0" data-duration="16.051" data-track-index="3" data-layout-allow-overlap data-layout-allow-occlusion>OpenAI</div>
    <div id="c5-chip-g" class="c5-chip clip" data-start="0" data-duration="16.051" data-track-index="4" data-layout-allow-overlap data-layout-allow-occlusion>Google</div>
    <div id="c5-chip-f" class="c5-chip clip" data-start="0" data-duration="16.051" data-track-index="5" data-layout-allow-overlap data-layout-allow-occlusion>Foundation</div>

      That's what it looks like when a <span class="accent">standard actually works.</span>

        <path d="M6,21 L15,30 L34,10" stroke="#f0b860" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div id="c5-follow-wrap" class="c5-follow-wrap clip" data-start="0" data-duration="16.051" data-track-index="9">
      <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle id="c5-follow-pulse" class="c5-follow-pulse" cx="200" cy="200" r="150" stroke="#f0b860" stroke-width="2"/>
        <circle id="c5-follow-ring" class="c5-follow-ring" cx="200" cy="200" r="115" stroke="#f0b860" stroke-width="4" transform="rotate(-90 200 200)"/>
      </svg>
      <div id="c5-follow-label" class="c5-follow-label">Follow</div>
    </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const glow = document.getElementById("c5-glow");
    const chipA = document.getElementById("c5-chip-a");
    const chipO = document.getElementById("c5-chip-o");
    const chipG = document.getElementById("c5-chip-g");
    const chipF = document.getElementById("c5-chip-f");
    const caption = document.getElementById("c5-caption");
    const beatInfra = document.getElementById("c5-beat-infra");
    const check = document.getElementById("c5-check");

    const followWrap = document.getElementById("c5-follow-wrap");
    const followRing = document.getElementById("c5-follow-ring");
    const followLabel = document.getElementById("c5-follow-label");
    const followPulse = document.getElementById("c5-follow-pulse");

    // "A protocol one company built" (0.53-2.21s) -- the four chips appear
    // scattered, carrying over the adoption arc from the previous frame.
    tl.fromTo(chipA, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 0.53);
    tl.fromTo(chipO, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 0.78);
    tl.fromTo(chipG, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 1.03);
    tl.fromTo(chipF, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, 1.28);

    // "became infrastructure" (2.95-3.41s) -- fills the real gap between
    // the last chip settling and the convergence beat.
    tl.fromTo(beatInfra, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.95);
    tl.to(beatInfra, { opacity: 0, duration: 0.3 }, 5.2);

    // "now govern together." (5.69-6.47s) -- the four chips converge to a
    // single central point, the literal payoff of the sentence. Animated
    // via transform (x/y), not left/top -- left/top snaps to integer
    // device pixels during layout and stutters under frame-seek capture,
    // transforms interpolate smoothly at any speed. Deltas computed from
    // each chip's own CSS position to the shared convergence point
    // (left:440, top:500).
    tl.to(chipA, { x: 300, y: 80, scale: 0.6, duration: 0.6, ease: "power2.inOut" }, 5.69);
    tl.to(chipO, { x: -200, y: 120, scale: 0.6, duration: 0.6, ease: "power2.inOut" }, 5.69);
    tl.to(chipG, { x: 240, y: -120, scale: 0.6, duration: 0.6, ease: "power2.inOut" }, 5.69);
    tl.to(chipF, { x: -120, y: -140, scale: 0.6, duration: 0.6, ease: "power2.inOut" }, 5.69);
    tl.to(glow, { opacity: 0.25, duration: 0.6 }, 5.69);

    // "That's what it looks like when a standard actually works." (8.21-11.21s)
    tl.fromTo(caption, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 8.21);

    // "standard" (9.89s) -- a genuinely new element (not a pulse on the
    // caption) lands mid-sentence, closing the real gap before the follow
    // ring's own beat begins.
    tl.fromTo(check, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, 9.89);
    // "actually works." (10.71-11.21s) -- a second beat on the same
    // element, right as the payoff word lands.
    tl.fromTo(check, { scale: 1 }, { scale: 1.3, duration: 0.2, yoyo: true, repeat: 1 }, 11.21);

    // "Follow" (12.83s onward) -- the same follow-ring device established in
    // What Skills Matter, kept consistent across pillars rather than
    // inventing a new CTA device per episode.
    tl.to(followWrap, { opacity: 1, duration: 0.2 }, 12.83);
    tl.to(followRing, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 12.83);
    tl.to(followLabel, { opacity: 1, duration: 0.4, ease: "power2.out" }, 13.13);

    // "for more on how AI systems actually work." (13.13-15.73s) -- ring
    // pulses keep producing new motion through the close.
    tl.fromTo(followPulse, { scale: 1, opacity: 0.6 }, { scale: 1.18, opacity: 0, duration: 0.6, ease: "power2.out" }, 14.29);
    tl.fromTo(followPulse, { scale: 1, opacity: 0.6 }, { scale: 1.18, opacity: 0, duration: 0.6, ease: "power2.out" }, 15.25);

    window.__timelines["05-close"] = tl;
  </script>
</template>
