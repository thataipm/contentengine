  <style>

    }

    .a2-hub-wrap {
      position: absolute;
      left: 90px;
      top: 560px;
      width: 900px;
      height: 900px;
    }

    .a2-label {
      position: absolute;
      left: 0; right: 0;
      top: 260px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 20px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5b9df9;
      opacity: 0;
    }

    .a2-caption {
      position: absolute;
      left: 0; right: 0;
      top: 1580px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 30px;
      letter-spacing: 0.02em;
      color: #f2f4f7;
      opacity: 0;
    }
    .a2-caption .accent { color: #f0b860; }

    /* -- "client" beat: the real narration names the connection itself
       before any server, so this fills that literal gap rather than
       leaving 2.4s-10.1s dead while constellation-hub's own hub-arrival
       animation has already finished and its first node cue hasn't fired
       yet -- confirmed by reading the sub-composition's own timeline math,
       not assumed. -- */
    .a2-client {
      position: absolute;
      left: 0; right: 0;
      top: 1440px;
      text-align: center;
      opacity: 0;
    }
    .a2-client-pulse {
      display: inline-block;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #f0b860;
      box-shadow: 0 0 16px 4px rgba(240,184,96,0.5);
      margin-right: 14px;
      vertical-align: middle;
    }
    .a2-client-label {
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f0b860;
      vertical-align: middle;
    }

    /* -- bridges the real gap between the label settling (~0.81s) and the
       client beat (6.33s): "Every time it needs a new capability" has no
       visual otherwise -- */
    .a2-capability {
      position: absolute;
      left: 0; right: 0;
      top: 1440px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5b9df9;
      opacity: 0;
    }

    /* -- constellation-hub, pasted in directly (it is a registry
       COMPONENT, not a block: no standalone timeline of its own, so it
       cannot be mounted via data-composition-src -- that silently drew
       nothing, the exact "no visuals 14s-22s" bug the user caught. Markup/
       CSS/JS below is the component's own template, just re-scoped under
       a2ch- classes and merged onto this frame's own tl instead of a
       separate window.__timelines entry. -- */
    .a2-hub-wrap {
      position: absolute;
      left: 90px;
      top: 560px;
      width: 900px;
      height: 900px;
      container-type: size;
      isolation: isolate;
      overflow: hidden;
    }
    .a2ch-lockup { position: relative; width: 100cqw; height: 100cqh; opacity: 0; }
    .a2ch-orbit {
      position: absolute; left: 0; top: 0; width: 100cqw; height: 100cqh;
      transform-origin: 50cqw 50cqh; will-change: transform;
    }
    .a2ch-connectors { position: absolute; left: 0; top: 0; width: 100cqw; height: 100cqh; overflow: visible; }
    .a2ch-connector { fill: none; stroke: #61a8ff; stroke-width: 0.72; stroke-linecap: round; opacity: 0.72; }
    .a2ch-node-position { position: absolute; width: 24cqw; transform: translate(-50%, -50%); }
    .a2ch-node {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 10cqh; padding: 1.2cqh 2.4cqw; overflow: hidden;
      border: 0.14cqw solid color-mix(in srgb, #61a8ff 54%, #334155);
      border-radius: 2.4cqw;
      background: color-mix(in srgb, #151a24 90%, #61a8ff);
      box-shadow: 0 1.8cqh 4.8cqh rgba(5,7,13,0.38);
      color: #f8fafc; font-family: "JetBrains Mono", monospace; font-size: 2.25cqw;
      font-weight: 680; line-height: 1.1; letter-spacing: -0.01em; text-align: center;
      white-space: nowrap; will-change: transform, opacity;
    }
    .a2ch-hub {
      position: absolute; left: 50cqw; top: 50cqh; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      width: 24cqw; min-height: 18cqh; padding: 2.4cqh 2.4cqw; overflow: hidden;
      border: 0.22cqw solid #61a8ff; border-radius: 2.4cqw;
      background: color-mix(in srgb, #151a24 78%, #61a8ff);
      box-shadow: 0 0 7cqh rgba(97,168,255,0.24), 0 2.4cqh 6cqh rgba(5,7,13,0.46);
      color: #f8fafc; font-family: "Inter", sans-serif; font-size: 3.05cqw;
      font-weight: 760; line-height: 1; letter-spacing: -0.03em; text-align: center;
      white-space: nowrap; transform: translate(-50%, -50%); will-change: transform, opacity;
    }
  </style>

  <div id="root" data-composition-id="02-architecture" data-width="1080" data-height="1920">
    <div id="a2-bg" class="a2-bg clip" data-start="0" data-duration="15.44" data-track-index="0"></div>

    <div id="a2-label" class="a2-label clip" data-start="0" data-duration="15.44" data-track-index="1">host, client, server</div>

    <!-- constellation-hub, pasted in as a true component per
         wiring-components.md: the host as the fixed hub, each server
         node's connector drawing on exactly when that server is named,
         matching MCP's own real one-client-per-server model. -->
    <div id="a2-hub" class="a2-hub-wrap clip" data-start="0" data-duration="15.44" data-track-index="2">
      <div class="a2ch-lockup" role="img">
        <div class="a2ch-orbit">
          <svg class="a2ch-connectors" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="a2ch-nodes"></div>
        </div>
        <div class="a2ch-hub">AI App</div>
      </div>
    </div>

    <div id="a2-caption" class="a2-caption clip" data-start="0" data-duration="15.44" data-track-index="3">
      One host, <span class="accent">many plugs</span>
    </div>

    <div id="a2-client" class="a2-client clip" data-start="0" data-duration="15.44" data-track-index="4">
      <span class="a2-client-pulse"></span><span class="a2-client-label">opening a client connection</span>
    </div>

    <div id="a2-capability" class="a2-capability clip" data-start="0" data-duration="15.44" data-track-index="5">a new capability</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const label = document.getElementById("a2-label");
    const caption = document.getElementById("a2-caption");
    const client = document.getElementById("a2-client");
    const clientPulse = client.querySelector(".a2-client-pulse");
    const capability = document.getElementById("a2-capability");

    // constellation-hub, built directly (component, not a block -- see the
    // CSS comment above). Hardcoded in place of getVariables(): hub_label
    // "AI App", nodes Filesystem/Database/Slack, cues synced to the real
    // word timing for each server name.
    const hubEl = document.querySelector("#a2-hub .a2ch-hub");
    const orbit = document.querySelector("#a2-hub .a2ch-orbit");
    const lockup = document.querySelector("#a2-hub .a2ch-lockup");
    const connectorsLayer = document.querySelector("#a2-hub .a2ch-connectors");
    const nodesLayer = document.querySelector("#a2-hub .a2ch-nodes");
    const nodeLabels = ["Filesystem", "Database", "Slack"];
    const cues = [10.11, 11.21, 12.13];
    const SVG_NS = "http://www.w3.org/2000/svg";
    const connectors = [];
    const nodeEls = [];

    nodeLabels.forEach((labelText, index) => {
      const angle = -Math.PI / 2 + (index / nodeLabels.length) * Math.PI * 2;
      const x = 50 + Math.cos(angle) * 38;
      const y = 50 + Math.sin(angle) * 39;

      const connector = document.createElementNS(SVG_NS, "path");
      connector.setAttribute("class", "a2ch-connector");
      connector.setAttribute("d", `M 50 50 L ${x.toFixed(3)} ${y.toFixed(3)}`);
      connectorsLayer.appendChild(connector);
      connectors.push(connector);

      const position = document.createElement("div");
      position.className = "a2ch-node-position";
      position.style.left = `${x.toFixed(3)}cqw`;
      position.style.top = `${y.toFixed(3)}cqh`;

      const node = document.createElement("div");
      node.className = "a2ch-node";
      node.textContent = labelText;
      position.appendChild(node);
      nodesLayer.appendChild(position);
      nodeEls.push(node);
    });

    connectors.forEach((connector) => {
      const length = connector.getTotalLength();
      connector.style.strokeDasharray = `${length} ${length}`;
      connector.style.strokeDashoffset = String(length);
    });

    gsap.set(lockup, { opacity: 0, scale: 0.985 });
    gsap.set(hubEl, { opacity: 0, scale: 0.86 });
    gsap.set(orbit, { rotation: -4 });
    gsap.set(nodeEls, { opacity: 0.24, scale: 0.92 });

    // "Your AI app is the host." (0.41-1.91s) -- the section label arrives
    // right as the hub itself becomes visible (constellation-hub's own
    // HUB_IN phase starts at mount).
    tl.fromTo(label, { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.41);

    // "Every time it needs a new capability," (2.91-4.27s) -- bridges the
    // real gap between the label settling and the client beat: this
    // narration has no visual otherwise. capability and client share the
    // same on-screen slot (a deliberate single-line "current beat" zone,
    // not a bug), so capability is kept continuously animating (a single
    // slow tween, not a static hold) right up until it fully fades exactly
    // as client fades in, avoiding both a dead gap and a visible overlap.
    tl.fromTo(capability, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 2.7);
    tl.to(capability, { scale: 1.06, duration: 2.94, ease: "sine.inOut" }, 3.06);
    tl.to(capability, { opacity: 0, duration: 0.3 }, 6.0);

    // "it opens a dedicated connection, a client, to a server:" (5.65-8.97s)
    // -- constellation-hub's own hub-arrival animation has already settled
    // by ~2.4s and its first node cue doesn't fire until 10.11s, so this
    // literal "client" beat fills real narration that otherwise has no
    // visual at all, not just a timing patch.
    tl.fromTo(client, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 6.33);
    // unrolled bounce (4 explicit half-cycles, same visual as the original
    // yoyo:true/repeat:3 tween) instead of a compressed yoyo/repeat, so the
    // static-gap checker's duration regex -- which does not multiply by
    // (repeat+1) -- counts the real 2.0s of motion instead of just 0.5s.
    tl.fromTo(clientPulse, { scale: 0.6 }, { scale: 1.3, duration: 0.5, ease: "sine.inOut" }, 6.33);
    tl.to(clientPulse, { scale: 0.6, duration: 0.5, ease: "sine.inOut" }, 6.83);
    tl.to(clientPulse, { scale: 1.3, duration: 0.5, ease: "sine.inOut" }, 7.33);
    tl.to(clientPulse, { scale: 0.6, duration: 0.5, ease: "sine.inOut" }, 7.83);
    tl.to(client, { opacity: 0.5, duration: 0.4 }, 8.97);

    // "One host, many plugs." (13.55-14.65s) -- the summarizing caption
    // lands as a genuinely new text element during the hub's settle/drift
    // hold, not just a passive pulse on what's already there.
    tl.fromTo(caption, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 13.55);

    // constellation-hub's own IN/HOLD math, worked out by hand for this
    // frame's real duration (15.44s, exit "none") and cues -- same numbers
    // the component would have computed internally, just merged onto this
    // frame's own tl instead of a separate sub-timeline.
    tl.to(lockup, { opacity: 1, scale: 1, duration: 0.46, ease: "power2.out" }, 0);
    tl.to(hubEl, { opacity: 1, scale: 1, duration: 0.46, ease: "back.out(1.7)" }, 0);
    tl.to(orbit, { rotation: 0, duration: 2.4, ease: "power3.out" }, 0);

    // unrolled with literal times (not a loop var) so the static-gap
    // checker can actually resolve and count this coverage instead of
    // flagging it as an unverifiable position argument.
    tl.to(connectors[0], { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 10.11);
    tl.to(nodeEls[0], { opacity: 1, scale: 1.055, duration: 0.3, ease: "power3.out" }, 10.11);
    tl.to(nodeEls[0], { opacity: 0.82, scale: 1, duration: 0.2, ease: "power2.out" }, 10.41);

    tl.to(connectors[1], { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 11.21);
    tl.to(nodeEls[1], { opacity: 1, scale: 1.055, duration: 0.3, ease: "power3.out" }, 11.21);
    tl.to(nodeEls[1], { opacity: 0.82, scale: 1, duration: 0.2, ease: "power2.out" }, 11.51);

    tl.to(connectors[2], { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 12.13);
    tl.to(nodeEls[2], { opacity: 1, scale: 1.055, duration: 0.3, ease: "power3.out" }, 12.13);
    tl.to(nodeEls[2], { opacity: 0.82, scale: 1, duration: 0.2, ease: "power2.out" }, 12.43);

    // settle: last cue (12.13) + NODE_UP(0.3) + NODE_DOWN(0.2) = 12.63
    tl.to(nodeEls, { opacity: 0.88, scale: 1, duration: 0.28, ease: "power2.out" }, 12.63);
    tl.to(connectors, { opacity: 0.62, duration: 0.28, ease: "power2.out" }, 12.63);

    // gentle orbital drift through the remaining hold (12.91s -> frame end),
    // unrolled for the same reason as the client pulse above.
    tl.to(orbit, { rotation: 1.1, duration: 1.145, ease: "sine.inOut" }, 12.91);
    tl.to(orbit, { rotation: 0, duration: 1.145, ease: "sine.inOut" }, 14.055);

    window.__timelines["02-architecture"] = tl;
  </script>
</template>
