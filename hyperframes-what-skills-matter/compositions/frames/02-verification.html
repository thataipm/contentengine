  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const glow = document.getElementById("v2-ember-glow");
    const core = document.getElementById("v2-ember-core");

    tl.to(glow, { opacity: 0.22, duration: 0.6, ease: "power2.out" }, 0.0);
    tl.to(core, { opacity: 0.6, duration: 0.5, ease: "power2.out" }, 0.0);

    // Each icon lands right on its real word's onset, then settles to a
    // dimmer accumulated state -- literal marks matching each spoken word,
    // not an abstract device.
    const beats = [
      ["v2-icon-sound", 0.88],
      ["v2-icon-confident", 1.78],
      ["v2-icon-wrong", 3.62, 1.35], // slightly larger pop, the negative beat
      ["v2-icon-true", 5.54],
      ["v2-icon-convincing", 6.02],
      ["v2-icon-you", 8.7],
    ];
    beats.forEach(([id, t, overScale]) => {
      const el = document.getElementById(id);
      tl.fromTo(
        el,
        { opacity: 0, scale: 0.5, y: 14 },
        { opacity: 1, scale: overScale || 1, y: 0, duration: 0.35, ease: "back.out(1.7)" },
        t
      );
      if (overScale) {
        tl.to(el, { scale: 1, duration: 0.25, ease: "power2.out" }, t + 0.35);
      }
      tl.to(el, { opacity: 0.55, duration: 0.5, ease: "power2.out" }, t + 0.7);
    });

    window.__timelines["02-verification"] = tl;
  </script>
