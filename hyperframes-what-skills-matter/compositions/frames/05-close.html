      const el = document.getElementById(id);
      tl.fromTo(
        el,
        { opacity: 0, scale: 0.5, y: 14 },
        { opacity: 1, scale: overScale || 1, y: 0, duration: 0.35, ease: "back.out(1.7)" },
        t
      );
      if (overScale) {
        tl.to(el, { scale: 1, duration: 0.25, ease: "power2.out" }, t + 0.35);
      }
      tl.to(el, { opacity: 0.55, duration: 0.5, ease: "power2.out" }, t + 0.7);

    const followWrap = document.getElementById("c5-follow-wrap");

      tl.fromTo(
        followPulse,
        { scale: 1, opacity: 0.6 },
        { scale: 1.18, opacity: 0, duration: 0.6, ease: "power2.out" },
        t
      );
    });
