        var cy = Number(el.dataset.clusterY);
        var tx = Number(el.dataset.targetX);
        var ty = Number(el.dataset.targetY);
        var rot = Number(el.dataset.rot);

        { scale: 1, opacity: 1, duration: BURST_DUR, ease: "power3.out" },

          duration: BURST_DUR,
          ease: "power3.out",
          onUpdate: function () {
            counterEl.textContent = Math.round(countState.value).toLocaleString();

        BURST_AT,

      // the number locks coral the instant the count lands
