  <script>
    (function () {
      var rect = document.getElementById("gap04-outline-rect");
      var rectLen = rect.getTotalLength();
      rect.style.strokeDasharray = String(rectLen);
      rect.style.strokeDashoffset = String(rectLen);

      var quoteText = document.getElementById("gap04-quote-text");

      // Pull-quote reveals in two discrete beats synced to the two short
      // imperative clauses of the voiceover ("Check first." / "Don't assume."),
      // not a per-character typewriter — reverse-search over a sparse
      // { t, text } sequence per the discrete-text-sequence rule.
      var QUOTE_SEQUENCE = [
        { t: 5.85, text: "" },
        { t: 6.35, text: "Check first." },
        { t: 7.55, text: "Check first. Don’t assume." },
      ];
      function quoteAt(time) {
        for (var i = QUOTE_SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= QUOTE_SEQUENCE[i].t) return QUOTE_SEQUENCE[i].text;
        }
        return "";
      }

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-3.0s): grid settles into its dimmed background state;
      // the empty slot's dashed outline draws on (svg-path-draw: measured
      // getTotalLength -> dasharray/dashoffset), then locks into a dashed
      // pattern once the trace completes. Camera fully static.
      tl.fromTo(
        ".gap04-grid",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        0
      );

      var drawDriver = { v: 0 };
      tl.to(
        drawDriver,
        {
          v: 1,
          duration: 1.6,
          ease: "power2.out",
          onUpdate: function () {
            if (drawDriver.v >= 1) {
              rect.style.strokeDasharray = "10 8";
              rect.style.strokeDashoffset = "0";
            } else {
              rect.style.strokeDasharray = String(rectLen);
              rect.style.strokeDashoffset = String((1 - drawDriver.v) * rectLen);
            }
          },
        },
        0.2
      );

      tl.fromTo(
        "#gap04-ghost",
        { opacity: 0 },
        { opacity: 0.16, duration: 0.6, ease: "power1.out" },
        1.4
      );

      // Scene 2 (3.0-5.6s): the allocated stillness. Nothing new enters —
      // no tweens placed in this window on purpose.

      // Scene 3 (5.6-8.888s): grid crossfades out entirely; the line lands
      // centered, alone on cream, and holds to the transition out (no exit
      // authored here — the root crossfade owns the exit).
      tl.to(
        [".gap04-grid", ".gap04-empty"],
        { opacity: 0, duration: 0.6, ease: "power1.out" },
        5.6
      );

      tl.fromTo(
        ".gap04-quote",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power1.out" },
        5.85
      );

      var quoteDriver = { t: 5.85 };
      tl.to(
        quoteDriver,
        {
          t: 8.888,
          duration: 8.888 - 5.85,
          ease: "none",
          onUpdate: function () {
            quoteText.textContent = quoteAt(quoteDriver.t);
          },
        },
        5.85
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["04-gap"] = tl;
    })();
  </script>
