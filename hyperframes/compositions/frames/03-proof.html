  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var scanline = document.getElementById("p03proof-scanline");
      var scanLen = scanline.getTotalLength();
      scanline.style.strokeDasharray = String(scanLen);
      scanline.style.strokeDashoffset = String(scanLen);

      var tl = gsap.timeline({ paused: true });

      var COUNT_TARGET = 40680;
      var COUNT_DUR = 1.8;
      var COUNT_START = 0.4;
      var COUNT_EASE = "power3.out";
      var counterEl = document.getElementById("p03proof-counter");
      var counterState = { value: 0 };
      var START_SCALE = 0.55;

      // ---- Scene 1 (0.0-2.8s): kicker + counting-dynamic-scale stat ----
      tl.fromTo(
        "#p03proof-kicker",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0
      );
      tl.fromTo(
        "#p03proof-mark",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "power2.out" },
        0
      );

      tl.to(
        counterState,
        {
          value: COUNT_TARGET,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            counterEl.textContent = Math.round(counterState.value).toLocaleString("en-US");
          },
        },
        COUNT_START
      );
      tl.fromTo(
        counterEl,
        { scale: START_SCALE },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_START
      );
      tl.to(
        "#p03proof-unit",
        { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" },
        COUNT_START + COUNT_DUR
      );

      // hand the frame's one coral moment off to the grid before Scene 3 begins
      tl.to(
        "#p03proof-counter, #p03proof-unit",
        { color: "#141413", duration: 0.6, ease: "power1.out" },
        5.3
      );

      // ---- Scene 2 (2.8-6.0s): section rule + 16-tile stagger-assemble ----
      tl.to(
        "#p03proof-rule",
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        2.8
      );

      var tiles = gsap.utils.toArray(".p03proof-tile");
      var ENTRY_AT = 2.9;
      var STAGGER = 0.05;
      var EXPAND_DUR = 1.1;
      var START_PROGRESS = 0.6;
      var EXPAND_EASE = "power3.out";

      tiles.forEach(function (el, i) {
        var tx = Number(el.dataset.targetX);
        var ty = Number(el.dataset.targetY);
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: tx * START_PROGRESS, y: ty * START_PROGRESS, scale: 0.6, opacity: 0 },
          { x: tx, y: ty, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: EXPAND_EASE },
          ENTRY_AT + i * STAGGER
        );
      });

      // ---- Scene 3 (6.0-9.5s): spotlight "count-up" ----
      // scan-band is still just part of the crowd here — it dims with everything
      // else and gets pulled back into focus in Scene 4 below.
      var ctxTiles = tiles.filter(function (el) {
        return el.id !== "p03proof-tile-countup";
      });
      tl.to(
        ctxTiles,
        { "--dof": "8px", opacity: 0.55, duration: 0.7, ease: "power2.inOut" },
        6.0
      );
      tl.fromTo(
        "#p03proof-ring-countup",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
        6.0
      );

      // ---- Scene 4 (9.5-13.08s): spotlight "scan-band" + camera settle ----
      tl.to(
        "#p03proof-tile-scanband",
        { "--dof": "0px", opacity: 1, duration: 0.5, ease: "power2.inOut" },
        9.5
      );
      tl.fromTo(
        "#p03proof-ring-scanband",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" },
        9.5
      );
      tl.to(
        scanline,
        { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
        9.6
      );
      tl.fromTo(
        "#p03proof-grid",
        { scale: 1.05 },
        { scale: 1, duration: 1.2, ease: "power3.out" },
        10.2
      );

      window.__timelines["03-proof"] = tl;
    })();
  </script>
