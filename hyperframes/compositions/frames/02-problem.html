  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var phraseEl = document.getElementById("p2-phrase-text");
      var kickerEl = document.getElementById("p2-kicker");
      var closingCoverEl = document.getElementById("p2-closing-cover");
      var closingBlurEl = document.getElementById("p2-closing-blur");
      var closingTextEl = document.querySelector(".p2-closing-text");
      var codeEl = document.getElementById("p2-code");
      var cursorEl = document.getElementById("p2-cursor");

      var termTypedEl = document.getElementById("p2-term-typed");
      var termCursorEl = document.getElementById("p2-term-cursor");
      var countFigureEl = document.getElementById("p2-count-figure");
      var countUnitEl = document.getElementById("p2-count-unit");

      // ---- Scenes 1-4: whole-line hard-cut swaps (discrete-text-sequence) ----
      var PHRASES = [
        { t: 0.0, text: "Every shot needed its own device.", size: 64, width: 820 },
        { t: 2.2, text: "A terminal card.", size: 44, width: 820 },
        { t: 3.6, text: "A counting number.", size: 44, width: 820 },
        { t: 5.2, text: "A container that holds items.", size: 40, width: 840 },
        { t: 7.3, text: "", size: 64, width: 820 },
      ];
      function phraseAt(time) {
        for (var i = PHRASES.length - 1; i >= 0; i--) {
          if (time >= PHRASES[i].t) return PHRASES[i];
        }
        return PHRASES[0];
      }
      var KICKERS = [
        { t: 2.2, text: "1/3" },
        { t: 3.6, text: "2/3" },
        { t: 5.2, text: "3/3" },
        { t: 7.3, text: "" },
      ];
      function kickerAt(time) {
        for (var i = KICKERS.length - 1; i >= 0; i--) {
          if (time >= KICKERS[i].t) return KICKERS[i].text;
        }
        return "";
      }

      var phraseDriver = { t: 0 };
      tl.to(
        phraseDriver,
        {
          t: 7.3,
          duration: 7.3,
          ease: "none",
          onUpdate: function () {
            var st = phraseAt(phraseDriver.t);
            phraseEl.textContent = st.text;
            phraseEl.style.fontSize = st.size + "px";
            phraseEl.style.maxWidth = st.width + "px";
          },
        },
        0,
      );

      var kickerDriver = { t: 0 };
      tl.to(
        kickerDriver,
        {
          t: 7.3,
          duration: 7.3,
          ease: "none",
          onUpdate: function () {
            kickerEl.textContent = kickerAt(kickerDriver.t);
          },
        },
        0,
      );

      // hard-cut FLASH-in on the phrase at each swap threshold: instant text swap
      // (above) + a fast opacity/scale/brightness snap to sell the "flash", never a
      // smooth fade/slide.
      [0, 2.2, 3.6, 5.2].forEach(function (st) {
        tl.fromTo(
          phraseEl,
          { opacity: 0, scale: 0.92, filter: "brightness(1.7)" },
          { opacity: 1, scale: 1, filter: "brightness(1)", duration: 0.14, ease: "power3.out" },
          st,
        );
      });

      // low-key kicker fade, trailing each phrase swap
      [2.2, 3.6, 5.2].forEach(function (st) {
        tl.fromTo(kickerEl, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, st + 0.15);
      });

      // literal MOTION graphic per item (direct instruction: real motion, not a static
      // icon+text pop-in) -- each device runs its own real animation for the whole beat,
      // hard-cut out when the next item's device takes over, matching the phrase's own
      // hard-cut register.

      // ---- device 1 (2.2-3.6s): terminal card -- real character-by-character typing ----
      var termEl = document.getElementById("p2-device-terminal");
      tl.set(termEl, { opacity: 1 }, 2.2);
      tl.set(termEl, { opacity: 0 }, 3.6);
      var TERM_CMD = "hyperframes add terminal-card";
      var termDriver = { n: 0 };
      tl.to(
        termDriver,
        {
          n: TERM_CMD.length,
          duration: 0.75,
          ease: "none",
          onUpdate: function () {
            termTypedEl.textContent = TERM_CMD.slice(0, Math.round(termDriver.n));
          },
        },
        2.25,
      );
      var TERM_BLINK_CYCLES = 3;
      var termBlink = { p: 0 };
      tl.to(
        termBlink,
        {
          p: Math.PI * 2 * TERM_BLINK_CYCLES,
          duration: 1.3,
          ease: "none",
          onUpdate: function () {
            termCursorEl.style.opacity = Math.sin(termBlink.p) > 0 ? "1" : "0";
          },
        },
        2.25,
      );

      // ---- device 2 (3.6-5.2s): counting number -- a real count-up, not a static figure ----
      var countEl = document.getElementById("p2-device-counting");
      tl.set(countEl, { opacity: 1 }, 3.6);
      tl.set(countEl, { opacity: 0 }, 5.2);
      tl.fromTo(
        countFigureEl,
        { scale: 0.7 },
        { scale: 1, duration: 1.0, ease: "power3.out" },
        3.65,
      );
      var countDriver = { value: 0 };
      tl.to(
        countDriver,
        {
          value: 100,
          duration: 1.0,
          ease: "power3.out",
          onUpdate: function () {
            countFigureEl.textContent = Math.round(countDriver.value).toLocaleString("en-US");
          },
        },
        3.65,
      );
      tl.fromTo(
        countUnitEl,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        4.65,
      );

      // ---- device 3 (5.2-7.3s): container -- items literally dropping into a box ----
      var ctrEl = document.getElementById("p2-device-container");
      tl.set(ctrEl, { opacity: 1 }, 5.2);
      tl.set(ctrEl, { opacity: 0 }, 7.3);
      ["p2-ctr-item-1", "p2-ctr-item-2", "p2-ctr-item-3"].forEach(function (id, i) {
        var el = document.getElementById(id);
        tl.fromTo(
          el,
          { opacity: 0, y: -46, scale: 0.7 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "bounce.out" },
          5.35 + i * 0.28,
        );
      });

      // ---- Scene 5: left->right swipe reveal with leading-edge blur ----
      var SWIPE_START = 7.35;
      var SWIPE_DUR = 1.1;
      var COVER_WIDTH = 860;
      var swipe = { p: 0 };
      tl.to(
        swipe,
        {
          p: 1,
          duration: SWIPE_DUR,
          ease: "power2.inOut",
          onUpdate: function () {
            var x = swipe.p * COVER_WIDTH;
            closingCoverEl.style.transform = "translateX(" + x + "px)";
            closingBlurEl.style.left = x - 28 + "px";
          },
        },
        SWIPE_START,
      );

      // subtle continuous breathe on the settled closing line through the hold
      // (never a static frame once the swipe lands)
      var BREATHE_START = SWIPE_START + SWIPE_DUR;
      var breathe = { p: 0 };
      tl.to(
        breathe,
        {
          p: Math.PI * 2,
          duration: Math.max(0.1, 10.607 - BREATHE_START),
          ease: "none",
          onUpdate: function () {
            var s = 1 + Math.sin(breathe.p) * 0.012;
            gsap.set(closingTextEl, { scale: s });
          },
        },
        BREATHE_START,
      );

      // code-surface strip build-in
      tl.fromTo(codeEl, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 7.3);

      // deterministic sin-wave cursor blink for the whole scene-5 hold
      var BLINK_CYCLES = 5;
      var blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * BLINK_CYCLES,
          duration: 3.307,
          ease: "none",
          onUpdate: function () {
            cursorEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        7.3,
      );

      window.__timelines["02-problem"] = tl;
    })();
