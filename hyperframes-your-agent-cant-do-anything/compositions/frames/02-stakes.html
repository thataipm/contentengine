    /* halftone-field's real internal canvas is a fixed 1920x1080 (landscape).
       Mounting it with data-width/height set to this frame's own 1080x1920
       (portrait) left the bottom ~44% of the canvas solid black -- the block
       was never built to reflow to a different aspect, it just renders at its
       native ratio inside whatever box it's given. Fix: mount it at its OWN
       native 1920x1080 size, then scale the whole mount up (1920/1080=1.778x)
       centered inside an overflow:hidden clip so it covers the full portrait
       frame the same way CSS background-size:cover would, cropping the sides
       instead of leaving a dead gap. */

    .f2-field-host {
